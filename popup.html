<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 250px;
        padding: 16px;
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.4;
      }
      button {
        display: block;
        width: 100%;
        margin: 0;
        padding: 10px 12px;
        cursor: pointer;
        box-sizing: border-box;
      }
      button + button {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <p>Anchor Selector needs access to this site.</p>
    <button id="grant-site">Allow on this site</button>
    <button id="grant-all">Allow on all sites</button>
    <script src="dist/popup.js"></script>
  </body>
</html>
