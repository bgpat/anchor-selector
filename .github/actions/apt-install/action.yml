name: Cached apt install
description: Install apt packages, reusing the package lists and archives from the last run

inputs:
  key:
    description: Cache version, such as v1. Bump it when the package list changes.
    required: true
  packages:
    description: Package names separated by spaces
    required: true

runs:
  using: composite
  steps:
    - id: os
      shell: bash
      run: |
        . /etc/os-release
        echo "version=${VERSION_ID}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      id: apt
      with:
        path: ~/apt-cache
        key: apt-${{ steps.os.outputs.version }}-${{ runner.arch }}-${{ inputs.key }}

    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        CACHE_HIT: ${{ steps.apt.outputs.cache-hit }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
