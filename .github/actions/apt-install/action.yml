name: Cached apt install
description: Install apt packages, reusing the package lists and archives from the last run

inputs:
  packages:
    description: Package names, one per line or separated by spaces
    required: true

runs:
  using: composite
  steps:
    - id: os
      shell: bash
      run: |
        . /etc/os-release
        echo "version=${VERSION_ID}" >> "$GITHUB_OUTPUT"

    - id: packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        mapfile -t package_list < <(printf '%s' "$PACKAGES" | tr -s '[:space:]' '\n' | sed '/^$/d' | sort -u)
        if [ "${#package_list[@]}" -eq 0 ]; then
          echo "packages input is empty" >&2
          exit 1
        fi
        hash=$(printf '%s\n' "${package_list[@]}" | sha256sum | awk '{print $1}')
        echo "hash=${hash}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      id: apt
      with:
        path: ~/apt-cache
        key: apt-${{ steps.os.outputs.version }}-${{ runner.arch }}-${{ steps.packages.outputs.hash }}

    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        CACHE_HIT: ${{ steps.apt.outputs.cache-hit }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
