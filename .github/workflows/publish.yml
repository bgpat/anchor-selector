# This workflow is managed by gh actions-lock.

name: publish
on:
  release:
    types:
      - released
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ vars.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      EXTENSION_ID: ${{ vars.EXTENSION_ID }}
      PUBLISHER_ID: ${{ vars.PUBLISHER_ID }}
      JWT_ISSUER: ${{ vars.JWT_ISSUER }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    strategy:
      matrix:
        browser:
          - firefox
          - chrome
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/bun-deps
      - run: bun run zip:${{ matrix.browser }}
      - if: matrix.browser == 'chrome'
        run: bun run publish:chrome
      - if: matrix.browser == 'firefox'
        shell: bash
        run: |
          bunx web-ext-submit \
            --source-dir .output/firefox \
            --channel listed \
            --upload-source-code .output/*-sources.zip \
            --amo-metadata <(jq -n --rawfile notes README.md '{version:{approval_notes:$notes}}') \
            --api-key="$JWT_ISSUER" \
            --api-secret="$JWT_SECRET"
