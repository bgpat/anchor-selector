name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  build:
    name: Build (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            outputDir: chrome-mv3
          - browser: firefox
            outputDir: firefox-mv3
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build:${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: .output/${{ matrix.outputDir }}
          if-no-files-found: error

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
          - browser: firefox
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build:${{ matrix.browser }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        run: bunx playwright install chromium firefox

      - name: Run E2E (headed via Xvfb)
        run: xvfb-run -a bun run test:e2e -- --project=${{ matrix.browser }}

      - name: Mint OAuth access token for attachments
        id: attachment_oauth
        if: >-
          always() &&
          secrets.ATTACHMENT_OAUTH_REFRESH_TOKEN != ''
        env:
          ATTACHMENT_OAUTH_CLIENT_ID: ${{ vars.ATTACHMENT_OAUTH_CLIENT_ID }}
          ATTACHMENT_OAUTH_CLIENT_SECRET: ${{ secrets.ATTACHMENT_OAUTH_CLIENT_SECRET }}
          ATTACHMENT_OAUTH_REFRESH_TOKEN: ${{ secrets.ATTACHMENT_OAUTH_REFRESH_TOKEN }}
        run: bash e2e/mint-attachment-oauth-token.sh

      - name: Add E2E screenshots to job summary
        if: always()
        env:
          ATTACHMENT_UPLOAD_PAT: ${{ steps.attachment_oauth.outputs.access_token || secrets.ATTACHMENT_UPLOAD_PAT }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: bun e2e/append-job-summary.ts ${{ matrix.browser }}

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.browser }}
          path: e2e/report
          if-no-files-found: ignore
          retention-days: 14
