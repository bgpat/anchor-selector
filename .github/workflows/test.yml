name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  build:
    name: Build (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: if [ "${{ matrix.browser }}" = "firefox" ]; then bun run build:firefox; else bun run build; fi
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: .output/${{ matrix.browser == 'firefox' && 'firefox-mv2' || 'chrome-mv3' }}
          if-no-files-found: error

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: if [ "${{ matrix.browser }}" = "firefox" ]; then bun run build:firefox; else bun run build; fi

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        run: bunx playwright install chromium firefox

      - name: Run E2E (headed via Xvfb)
        run: xvfb-run -a bun run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload screen recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-recording-${{ matrix.browser }}
          path: e2e/test-results/**/videos/*.webm
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.browser }}
          path: e2e/report
          if-no-files-found: ignore
          retention-days: 14
