name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  build:
    name: Build (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            outputDir: chrome-mv3
          - browser: firefox
            outputDir: firefox-mv2
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build:${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: .output/${{ matrix.outputDir }}
          if-no-files-found: error

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
          - browser: firefox
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build:${{ matrix.browser }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        run: bunx playwright install chromium firefox

      - name: Run E2E (headed via Xvfb)
        run: xvfb-run -a bun run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload Playwright HTML report (videos embedded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.browser }}
          path: e2e/report
          if-no-files-found: error
          retention-days: 30

  e2e-report-hub:
    name: E2E report (browser)
    needs: e2e
    if: always() && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: e2e-report-chrome
          path: site/chrome
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: e2e-report-firefox
          path: site/firefox
        continue-on-error: true

      - run: bun e2e/build-report-hub.ts site

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: site
          if-no-files-found: error
          retention-days: 30

      - name: How to watch recordings in a browser
        run: |
          {
            echo '### E2E recordings (browser)'
            echo ''
            echo 'Download the **e2e-report** artifact, unzip it, and open **`index.html`** in a browser.'
            echo 'Each browser report embeds the WebM recording on the test (attachment **video**).'
            echo ''
            echo 'Locally after \`bun run test:e2e\`: \`bun run test:e2e:report\` opens the same UI at http://127.0.0.1:9323 .'
          } >> "$GITHUB_STEP_SUMMARY"
