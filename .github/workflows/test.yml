# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
  pull_request:

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        id: deps-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

  typecheck:
    name: Typecheck
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run lint

  build:
    name: Build (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            outputDir: chrome-mv3
          - browser: firefox
            outputDir: firefox-mv3
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build:${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: .output/${{ matrix.outputDir }}
          if-no-files-found: error

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
          - browser: firefox
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build:${{ matrix.browser }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright browsers
        run: bunx playwright install chromium firefox

      - name: Run E2E (headed via Xvfb)
        run: xvfb-run -a bun run test:e2e -- --project=${{ matrix.browser }}

      - name: Add E2E screenshots to job summary
        if: always()
        run: bun e2e/append-job-summary.ts ${{ matrix.browser }}

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.browser }}
          path: e2e/report
          if-no-files-found: ignore
          retention-days: 14
